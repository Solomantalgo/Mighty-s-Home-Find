name: Build and deploy Home Finds to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homefinds-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy over explicit FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.5
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Next.js with Webpack
        run: npx next build --webpack

      - name: Prepare runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp -a app components lib public .next deploy/
          cp package.json package-lock.json next.config.ts passenger.cjs deploy/
          rm -rf deploy/.next/cache

      - name: Confirm FTPS settings are configured
        shell: bash
        env:
          FTPS_HOST: ${{ secrets.CPANEL_FTP_SERVER }}
          FTPS_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          FTPS_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$FTPS_HOST" ]] || missing+=(CPANEL_FTP_SERVER)
          [[ -n "$FTPS_PORT" ]] || missing+=(CPANEL_FTP_PORT)
          [[ -n "$FTPS_USERNAME" ]] || missing+=(CPANEL_FTP_USERNAME)
          [[ -n "$FTPS_PASSWORD" ]] || missing+=(CPANEL_FTP_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'Deployment stopped before FTPS because configuration is missing: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "$FTPS_HOST" != "cloud207.cloudwebhosting.com" || "$FTPS_PORT" != "21" ]]; then
            echo "Configure the FTPS server as cloud207.cloudwebhosting.com on port 21."
            exit 1
          fi

      - name: Upload application and build over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/plan/**
            **/qa/**
            **/prototype/**
            **/tmp/restart.txt

      - name: Stage Passenger restart marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/tmp
          printf '%s\n' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > deploy/tmp/restart.txt

      - name: Upload restart marker last
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/plan/**
            **/qa/**
            **/prototype/**
