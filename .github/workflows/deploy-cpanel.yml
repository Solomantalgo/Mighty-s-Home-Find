name: Build and deploy Home Finds to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homefinds-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, and deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.5
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare validated bed image catalog
        run: node scripts/prepare-bed-image-catalog.cjs

      - name: Build Next.js with Webpack
        run: npx next build --webpack

      - name: Prepare runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/tmp
          cp -a app components lib public .next deploy/
          cp package.json package-lock.json next.config.ts passenger.cjs deploy/
          rm -rf deploy/.next/cache
          : > deploy/tmp/.keep

      - name: Publish runtime branch for cPanel
        shell: bash
        run: |
          set -euo pipefail
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          runtime_dir="$RUNNER_TEMP/homefinds-cpanel-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          cp -a deploy/. "$runtime_dir/"
          cd "$runtime_dir"
          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Deploy ${GITHUB_SHA}"
          git branch -M cpanel-deploy
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "$auth_header"
          git push --force origin HEAD:refs/heads/cpanel-deploy

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing CPANEL_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$SSH_KEY_PASSPHRASE" || { echo "Missing CPANEL_SSH_KEY_PASSPHRASE secret"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing CPANEL_SSH_KNOWN_HOSTS secret"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/homefinds_deploy"
          chmod 600 "$HOME/.ssh/homefinds_deploy"
          ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f "$HOME/.ssh/homefinds_deploy"
          ssh-keygen -y -f "$HOME/.ssh/homefinds_deploy" > "$HOME/.ssh/homefinds_deploy.pub"
          ssh-keygen -lf "$HOME/.ssh/homefinds_deploy.pub"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull deployment and restart Passenger
        shell: bash
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_SSH_HOST" || { echo "Missing CPANEL_SSH_HOST secret"; exit 1; }
          test -n "$CPANEL_SSH_PORT" || { echo "Missing CPANEL_SSH_PORT secret"; exit 1; }
          test -n "$CPANEL_SSH_USER" || { echo "Missing CPANEL_SSH_USER secret"; exit 1; }
          echo "SSH target: $CPANEL_SSH_USER@$CPANEL_SSH_HOST:$CPANEL_SSH_PORT"
          ssh \
            -vv \
            -i "$HOME/.ssh/homefinds_deploy" \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/home2/mightyhomefinds/homefinds
          cd "$APP"
          git fetch --quiet origin cpanel-deploy
          target="$(git rev-parse FETCH_HEAD)"
          current="$(git rev-parse HEAD)"
          if [ "$target" != "$current" ]; then
            git checkout --force --detach "$target"
            rm -rf "$APP/.next/cache"
            printf '%s\n' "$target" > "$APP/tmp/restart.txt"
            echo "Deployed $target, cleared the stale Next.js cache, and requested Passenger restart."
          else
            echo "cPanel is already running $target."
          fi
          REMOTE
