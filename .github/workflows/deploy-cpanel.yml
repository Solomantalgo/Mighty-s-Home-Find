name: Build and deploy Home Finds to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homefinds-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy through cPanel HTTPS API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.5
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Next.js with Webpack
        run: npx next build --webpack

      - name: Prepare runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/tmp
          cp -a app components lib public .next deploy/
          cp package.json package-lock.json next.config.ts passenger.cjs deploy/
          rm -rf deploy/.next/cache
          : > deploy/tmp/.keep

      - name: Package production runtime
        run: tar -czf homefinds-deploy.tar.gz -C deploy .

      - name: Deploy through cPanel HTTPS API
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USERNAME: mightyhomefinds
          CPANEL_HOST: cloud207.cloudwebhosting.com
          CPANEL_APP_ROOT: homefinds
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/deploy-cpanel-api.mjs homefinds-deploy.tar.gz
