name: Build and deploy Home Finds to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homefinds-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish runtime for cPanel pull
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.5
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Next.js with Webpack
        run: npx next build --webpack

      - name: Prepare runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/tmp
          cp -a app components lib public .next deploy/
          cp package.json package-lock.json next.config.ts passenger.cjs deploy/
          rm -rf deploy/.next/cache
          : > deploy/tmp/.keep

      - name: Package production runtime
        run: tar -czf homefinds-deploy.tar.gz -C deploy .

      - name: Publish runtime branch for cPanel to pull
        run: |
          set -euo pipefail
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          runtime_dir="$RUNNER_TEMP/homefinds-cpanel-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          cp -a deploy/. "$runtime_dir/"
          cd "$runtime_dir"
          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Deploy ${GITHUB_SHA}"
          git branch -M cpanel-deploy
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "$auth_header"
          git push --force origin HEAD:refs/heads/cpanel-deploy
